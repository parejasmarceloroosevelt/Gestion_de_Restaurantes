<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grades Module</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f6f9;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .card{
      background:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      width:320px;
    }

    h2{
      margin-bottom:20px;
      color:#333;
      text-align:center;
    }

    input{
      width:100%;
      padding:10px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:8px;
    }

    button{
      width:100%;
      padding:10px;
      border:none;
      border-radius:8px;
      background:#4f46e5;
      color:white;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      opacity:0.9;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>HOLA MI CAUSIM, DEJA DE IMITARME</h2>

    <input type="text" placeholder="Student Name" />
    <input type="number" placeholder="Grade" />

    <button>Save Grade</button>
  </div>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>HOLA MANITO</h1>
</body>
</html>
